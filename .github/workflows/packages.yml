name: Coordinated packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docker/curl/**'
      - 'docker/freeipa-client/**'
      - 'scripts/*native-client*'
      - 'apt/native-client-*'
      - '.github/workflows/native-client.yml'
      - 'tests/native-client*'
      - 'docs/**'
      - '**/*.md'
permissions:
  contents: read
concurrency:
  group: coordinated-packages
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      source_key: ${{ steps.source_key.outputs.key }}
      qualified: ${{ steps.qualification.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read pinned sources and prepare versions once
        run: scripts/prepare.sh
      - name: Identify source verification inputs
        id: source_key
        run: printf 'key=%s\n' "$(ruby scripts/source-key.rb)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: qualification
        with:
          path: dist/source-qualification.json
          key: source-qualified-${{ steps.source_key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coordinated-inputs
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coordinated-inputs
          path: dist
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: '3.4'
      - run: scripts/checkout-sources.sh openvox jvm-ssl-utils openvox-server openvoxserver-ca jruby-openssl vault
      - name: Verify archive integrity and recipes
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
          bash tests/archive.sh
          bash tests/targets.sh
          ruby tests/server-recipe.rb
          ruby tests/source-recipe.rb
          ruby tests/source-snapshot.rb
          ruby tests/source-key.rb
          ruby tests/source-qualification.rb
          ruby tests/server-test-shards.rb
          ruby tests/bundler-env.rb
          ruby tests/build-manifest.rb
          ruby tests/repackage-server.rb
          ruby tests/release-manifest.rb
          ruby tests/publication.rb
          ruby tests/publication-gates.rb
          ruby tests/acceptance-diagnostics.rb
          ruby tests/acceptance-variants.rb
  server_build:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SERVER_BUILDER_IMAGE: openvox-packages-server-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coordinated-inputs
          path: dist
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: '3.4'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Check out the package source snapshot
        run: |
          scripts/checkout-sources.sh jvm-ssl-utils openvox-server openvoxserver-ca jruby-openssl
          ruby scripts/select-target.rb
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.m2/repository
            ${{ runner.temp }}/openvox-packages-bundle
          key: server-deps-${{ needs.resolve.outputs.source_key }}
          restore-keys: server-deps-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: builder
        with:
          path: /tmp/openvox-server-builder.tar
          key: server-builder-${{ hashFiles('sources/openvox-server/Dockerfile') }}
      - name: Load or build the server builder
        run: |
          if [[ -f /tmp/openvox-server-builder.tar ]]; then
            docker load -i /tmp/openvox-server-builder.tar
          else
            docker build -t "$SERVER_BUILDER_IMAGE" sources/openvox-server
            docker save "$SERVER_BUILDER_IMAGE" -o /tmp/openvox-server-builder.tar
          fi
      - name: Compile and package the shared server once
        run: scripts/build-server.sh
      - name: Record the server package identity
        run: |
          ruby -rjson -rdigest <<'RUBY_BUILD'
          package = Dir['dist/openvox-server_*.deb']
          abort 'Expected one shared server package' unless package.size == 1
          File.write('dist/server-build.json', JSON.pretty_generate({
            'java' => `java -version 2>&1`.strip,
            'server' => File.basename(package.first),
            'server_sha256' => Digest::SHA256.file(package.first).hexdigest
          }) + "\n")
          RUBY_BUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shared-server
          path: |
            dist/openvox-server_*.deb
            dist/server-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-gems
          path: dist/*.gem
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  source:
    needs: resolve
    if: needs.resolve.outputs.qualified != 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [agent, ssl]
    uses: ./.github/workflows/source-tests.yml
    with:
      suite: ${{ matrix.suite }}
      source_key: ${{ needs.resolve.outputs.source_key }}
  server_tests:
    needs: [resolve, server_build]
    if: needs.resolve.outputs.qualified != 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [ca, jruby, other]
    uses: ./.github/workflows/source-tests.yml
    with:
      suite: ${{ matrix.suite }}
      source_key: ${{ needs.resolve.outputs.source_key }}
  qualify:
    needs: [resolve, verify, server_build, source, server_tests]
    if: >-
      always() && needs.resolve.result == 'success' && needs.verify.result == 'success' &&
      needs.server_build.result == 'success' &&
      (needs.resolve.outputs.qualified == 'true' ||
      (needs.source.result == 'success' && needs.server_tests.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shared-server
          path: dist
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: needs.resolve.outputs.qualified == 'true'
        with:
          path: dist/source-qualification.json
          key: source-qualified-${{ needs.resolve.outputs.source_key }}
          fail-on-cache-miss: true
      - name: Record successful source verification
        env:
          SOURCE_KEY: ${{ needs.resolve.outputs.source_key }}
          REUSED: ${{ needs.resolve.outputs.qualified }}
        run: |
          ruby -rjson <<'RUBY_CHECKS'
          key = ENV.fetch('SOURCE_KEY')
          reused = ENV['REUSED'] == 'true'
          proof = if reused
                    JSON.parse(File.read('dist/source-qualification.json'))
                  else
                    { 'key' => key, 'run' => ENV.fetch('GITHUB_RUN_ID') }
                  end
          abort 'Mismatched source verification' unless proof.fetch('key') == key
          File.write('dist/source-qualification.json', JSON.pretty_generate(proof) + "\n")
          checks = JSON.parse(File.read('dist/server-build.json'))
          checks['checks'] = %w[source_tests vault_source_tests server_recipe server_package_tests].to_h { |name| [name, 'passed'] }
          checks['source_verification'] = proof.merge('reused' => reused)
          File.write('dist/source-checks.json', JSON.pretty_generate(checks) + "\n")
          RUBY_CHECKS
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: needs.resolve.outputs.qualified != 'true'
        with:
          path: dist/source-qualification.json
          key: source-qualified-${{ needs.resolve.outputs.source_key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-checks
          path: dist/source-checks.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu26.04, debian13]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coordinated-inputs
          path: dist
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: '3.4'
      - name: Check out and version the target agent
        run: |
          scripts/checkout-sources.sh openvox
          ruby scripts/select-target.rb
      - name: Build agent
        run: scripts/build-agent.sh
      - name: Test built agent
        run: scripts/test-agent.sh
      - name: Record successful build checks
        run: |
          ruby -rjson -rdigest <<'RUBY_CHECKS'
          manifest_path = "dist/build-manifest-#{ENV.fetch('TARGET')}.json"
          manifest = JSON.parse(File.read(manifest_path))
          agent_log = 'dist/agent-test.log'
          agent_crypto = File.file?(agent_log) && File.readlines(agent_log).find { |line| line.start_with?('Ruby ') }
          abort 'Missing installed agent runtime report' unless agent_crypto

          manifest['checks'] = { 'agent_package_tests' => 'passed' }
          manifest['runtime_inputs'] = {
            'agent_runtime' => JSON.parse(File.read('sources/openvox/packaging/configs/components/puppet-runtime.json')),
            'agent_crypto' => agent_crypto.strip
          }
          manifest['sha256'] = Dir['dist/*.deb'].to_h do |package_path|
            [File.basename(package_path), Digest::SHA256.file(package_path).hexdigest]
          end
          File.write(manifest_path, JSON.pretty_generate(manifest) + "\n")
          RUBY_CHECKS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/openvox-agent_*.deb
            dist/build-manifest-${{ matrix.target }}.json
            dist/agent-test.log
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [qualify, build]
    if: always() && needs.qualify.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.tag }}
      candidate_url: ${{ steps.candidate.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coordinated-inputs
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shared-server
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-checks
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Reuse server payload and assemble coordinated evidence
        run: |
          ruby scripts/assemble-release.rb
          ruby scripts/select-target.rb
      - name: Sign and publish candidate
        id: candidate
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_PRIMARY_FINGERPRINT: ${{ vars.APT_PRIMARY_FINGERPRINT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
          gh --version
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          scripts/publish.sh
  acceptance:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu26.04, debian13]
    env:
      TARGET: ${{ matrix.target }}
      CANDIDATE_URL: ${{ needs.publish.outputs.candidate_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore candidate identity and tested Vault module
        run: |
          mkdir -p dist
          curl -fsSLo dist/build-manifest.json "${CANDIDATE_URL}build-manifest.json"
          ruby -rjson <<'RUBY_IDENTITY'
          manifest = JSON.parse(File.read('dist/build-manifest.json'))
          target = manifest.fetch('targets').fetch(ENV.fetch('TARGET'))
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts "AGENT_VERSION=#{target.fetch('sources').fetch('openvox').fetch('package_version')}"
            file.puts "SERVER_VERSION=#{target.fetch('sources').fetch('openvox-server').fetch('package_version')}"
            previous = manifest.fetch('previous', {})[ENV.fetch('TARGET')]
            if previous
              file.puts "PREVIOUS_AGENT=#{previous.fetch('agent')}"
              file.puts "PREVIOUS_SERVER=#{previous.fetch('server')}"
            end
          end
          RUBY_IDENTITY
          scripts/checkout-sources.sh vault
      - name: Anonymous APT and installed-package acceptance
        run: scripts/acceptance.sh "$CANDIDATE_URL" openvox-archive-keyring.asc "${PREVIOUS_AGENT:-}" "${PREVIOUS_SERVER:-}"
      - name: Retain acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-diagnostics-${{ matrix.target }}
          path: |
            evidence/acceptance/host-status.txt
            evidence/acceptance/build.log
            evidence/acceptance/status.txt
            evidence/acceptance/scope.txt
            evidence/acceptance/versions.txt
            evidence/acceptance/jruby-openssl.log
            evidence/acceptance/generate.log
            evidence/acceptance/crls.log
            evidence/acceptance/vault-setup.log
            evidence/acceptance/lifecycle.log
            evidence/acceptance/results.txt
            evidence/acceptance/RSA-lifecycle/import.log
            evidence/acceptance/RSA-lifecycle/startup.log
            evidence/acceptance/RSA-lifecycle/service.log
            evidence/acceptance/RSA-lifecycle/agent-first.log
            evidence/acceptance/RSA-lifecycle/agent-second.log
            evidence/acceptance/RSA-lifecycle/agent-good.log
            evidence/acceptance/RSA-lifecycle/agent-denied.log
            evidence/acceptance/RSA-lifecycle/agent-replacement.log
            evidence/acceptance/RSA-lifecycle/tls-negotiation.json
            evidence/acceptance/RSA-lifecycle/revocation-error.txt
            evidence/acceptance/ML-DSA-44-lifecycle/import.log
            evidence/acceptance/ML-DSA-44-lifecycle/startup.log
            evidence/acceptance/ML-DSA-44-lifecycle/service.log
            evidence/acceptance/ML-DSA-44-lifecycle/agent-first.log
            evidence/acceptance/ML-DSA-44-lifecycle/agent-second.log
            evidence/acceptance/ML-DSA-44-lifecycle/agent-good.log
            evidence/acceptance/ML-DSA-44-lifecycle/agent-denied.log
            evidence/acceptance/ML-DSA-44-lifecycle/agent-replacement.log
            evidence/acceptance/ML-DSA-44-lifecycle/tls-negotiation.json
            evidence/acceptance/ML-DSA-44-lifecycle/revocation-error.txt
            evidence/acceptance/RSA-setup-lifecycle/setup.log
            evidence/acceptance/RSA-setup-lifecycle/startup.log
            evidence/acceptance/RSA-setup-lifecycle/service.log
            evidence/acceptance/RSA-setup-lifecycle/agent-first.log
            evidence/acceptance/RSA-setup-lifecycle/agent-second.log
            evidence/acceptance/RSA-setup-lifecycle/agent-good.log
            evidence/acceptance/RSA-setup-lifecycle/agent-denied.log
            evidence/acceptance/RSA-setup-lifecycle/agent-replacement.log
            evidence/acceptance/RSA-setup-lifecycle/tls-negotiation.json
            evidence/acceptance/RSA-setup-lifecycle/revocation-error.txt
            evidence/acceptance/ML-DSA-44-setup-lifecycle/setup.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/startup.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/service.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/agent-first.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/agent-second.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/agent-good.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/agent-denied.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/agent-replacement.log
            evidence/acceptance/ML-DSA-44-setup-lifecycle/tls-negotiation.json
            evidence/acceptance/ML-DSA-44-setup-lifecycle/revocation-error.txt
            evidence/acceptance/package-puppetserver.log
            evidence/acceptance/package-puppetserver-daemon.log
          if-no-files-found: warn
          retention-days: 14
  promote:
    needs: [publish, acceptance]
    if: always() && needs.publish.result == 'success' && needs.acceptance.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_TAG: ${{ needs.publish.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Promote only after both targets pass
        run: |
          printf '\nAcceptance: passed\n' >> RELEASE-NOTES.md
          gh release edit "$CANDIDATE_TAG" --latest --notes-file RELEASE-NOTES.md
  prepare_image:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_TAG: ${{ needs.publish.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test the candidate image
        run: bash scripts/server-image.sh "$CANDIDATE_TAG" --prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-image-prepared
          path: |
            dist/server-image.tar
            dist/server-image-prepared.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  server_image:
    needs: [publish, promote, prepare_image]
    if: always() && needs.publish.result == 'success' && needs.promote.result == 'success' && needs.prepare_image.result == 'success'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      release: ${{ needs.publish.outputs.candidate_tag }}
      prepared: true
